<h2>Reset your Luckline password</h2>
<p>Click the link below, press <strong>Continue</strong> on the page that opens, then choose a new password.</p>
<p><a href="{{ .SiteURL }}/auth/confirm/?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a></p>
<p>This link expires in 5 minutes. If you did not ask for it, ignore this email and your password stays the same.</p>
